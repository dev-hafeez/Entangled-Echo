version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: entangled_echo_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: entangled_echo_api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATA_MODE=seed
      - AI_SERVICE_URL=http://ml:8001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - TOKEN_ENC_KEY=${TOKEN_ENC_KEY}
    volumes:
      - ./storage:/app/storage
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    container_name: entangled_echo_ml
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
